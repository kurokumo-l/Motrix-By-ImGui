name: CI Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Test (Windows x64 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake 4.4 and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/Release/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure, Build, Test & Check Standards (Release)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          pwsh -NoProfile -File .\scripts\build.ps1 -Config Release -Test -CheckStandards

      - name: Stage portable package
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $stage = "dist/MotrixByImGui-win64"
          New-Item -ItemType Directory -Force -Path "$stage/engine" | Out-Null
          Copy-Item "build/Release/bin/motrix_native.exe" "$stage/motrix_native.exe" -Force
          Copy-Item "build/Release/bin/assets" "$stage/assets" -Recurse -Force
          Copy-Item "README.md", "LICENSE" "$stage/" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/MotrixByImGui-win64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotrixByImGui-win64
          path: |
            dist/MotrixByImGui-win64.zip
            dist/MotrixByImGui-win64/

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MotrixByImGui-win64.zip
          generate_release_notes: true
