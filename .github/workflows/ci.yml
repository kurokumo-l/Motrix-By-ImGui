name: CI Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Test (Windows x64 Release)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        with:
          arch: x64

      - name: Setup CMake 4.4 and Ninja
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0
        with:
          cmakeVersion: 4.4.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/Release/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Ensure clang-format is available
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $cf = (Get-Command clang-format -ErrorAction SilentlyContinue)?.Source
          if (-not $cf -and (Test-Path "C:\Program Files\LLVM\bin\clang-format.exe")) {
            $cf = "C:\Program Files\LLVM\bin\clang-format.exe"
          }
          if (-not $cf) {
            choco install llvm --yes --no-progress
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"
          } else {
            Write-Host "Using clang-format at $cf"
          }

      - name: Setup aria2-next engine for live tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $apiHeaders = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "MotrixByImGui-CI" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/AnInsomniacy/aria2-next/releases/latest" -Headers $apiHeaders
          $asset = $rel.assets | Where-Object {
            $n = $_.name.ToLowerInvariant()
            $n.EndsWith(".exe") -and $n.Contains("windows") -and ($n.Contains("x86_64") -or $n.Contains("x64") -or $n.Contains("amd64")) -and -not ($n.Contains("arm64") -or $n.Contains("386"))
          } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "Could not find Windows x64 aria2-next .exe asset in latest release ($($rel.tag_name))."
            exit 1
          }
          $digest = [string]$asset.digest
          if ($digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
            Write-Error "Missing or invalid SHA-256 digest on aria2-next asset '$($asset.name)': '$digest'"
            exit 1
          }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $dir = "C:\tools\aria2-next"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $outExe = "$dir\aria2-next.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers @{ "User-Agent" = "MotrixByImGui-CI" } -OutFile $outExe
          $actualHash = (Get-FileHash -Path $outExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Remove-Item -Path $outExe -Force -ErrorAction SilentlyContinue
            Write-Error "SHA-256 mismatch for $($asset.name): expected $expectedHash, got $actualHash"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Host "Installed and verified $($asset.name) ($expectedHash) to $outExe"

      - name: Configure, Build, Test & Check Standards (Release)
        shell: pwsh
        env:
          MOTRIX_REQUIRE_LIVE_TESTS: "1"
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          pwsh -NoProfile -File .\scripts\build.ps1 -Config Release -Test -CheckStandards

      - name: Stage portable package
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $stage = "dist/MotrixByImGui-win64"
          New-Item -ItemType Directory -Force -Path "$stage/engine" | Out-Null
          Copy-Item "build/Release/bin/motrix_native.exe" "$stage/motrix_native.exe" -Force
          Copy-Item "build/Release/bin/assets" "$stage/assets" -Recurse -Force
          Copy-Item "README.md", "LICENSE" "$stage/" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/MotrixByImGui-win64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MotrixByImGui-win64
          path: dist/MotrixByImGui-win64.zip

  release:
    name: Create GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MotrixByImGui-win64
          path: dist

      - name: Verify release tag matches CMakeLists.txt version
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $cm = Get-Content -Path "CMakeLists.txt" -Raw
          if ($cm -notmatch 'project\s*\(\s*motrix_native\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            Write-Error "Could not extract project version from CMakeLists.txt"
            exit 1
          }
          $expectedTag = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            Write-Error "Tag '$env:GITHUB_REF_NAME' does not match CMakeLists.txt version '$expectedTag'"
            exit 1
          }
          if (-not (Test-Path "dist/MotrixByImGui-win64.zip")) {
            Write-Error "Missing dist/MotrixByImGui-win64.zip artifact"
            exit 1
          }

      - name: Create GitHub Release (on tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/MotrixByImGui-win64.zip
          generate_release_notes: true
